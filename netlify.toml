[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Route /api/webhook to the Netlify function of the same name.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so client-side routes (e.g. /results) resolve on refresh/direct load.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
